name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'    # Fix: updated from EOL Node 16 to Node 20 LTS
      - run: npm ci              # Fix: reproducible installs using lockfile

  test:
    runs-on: ubuntu-latest
    needs: install               # Fix: ensure install completes before test runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci              # Fix: install node_modules before running tests
      - run: npm test
