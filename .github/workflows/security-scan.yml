name: Security Scan

on:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    # Fix: removed `if: false` — scan re-enabled (was disabled since commit af8ec1c)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=moderate  # Fix: broader vulnerability coverage
